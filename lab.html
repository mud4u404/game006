<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0D1114">
  <title>武学试算台 · 江湖夜雨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&amp;family=Noto+Serif+SC:wght@600;900&amp;display=swap">
  <style>
    body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-sans)}
    .lab{max-width:760px;margin:0 auto;padding:12px;display:grid;gap:12px}
    @media(min-width:720px){.lab{grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}}
    .lab h1{font:900 18px/1.3 var(--f-serif);margin:0 0 4px}
    .lab h2{font:700 14px/1.3 var(--f-sans);margin:0 0 8px}
    .lab .mut{color:var(--muted);font-size:12px;margin:6px 0 0}
    .row{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-top:8px}
    .f{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
    select,input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 6px}
    select:disabled{opacity:.45}
    input[type=number]{width:52px}
    input[type=range]{width:104px;padding:0;border:none;background:none}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left}
    th{color:var(--muted);font-weight:500}
    .over td{color:var(--danger);font-weight:700}
  </style>
</head>
<body>
  <div id="lab"></div>
  <script type="module" src="/src/lab/main.ts"></script>
</body>
</html>
