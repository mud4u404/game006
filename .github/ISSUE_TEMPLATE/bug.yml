name: 问题反馈
description: 游戏里遇到的错误或体验问题
title: "【问题】"
labels: ["问题"]
body:
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 在哪里、做了什么、看到了什么；有截图更好
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望是什么
  - type: input
    id: device
    attributes:
      label: 设备与浏览器
      placeholder: 例如 iPhone 15 / Safari
