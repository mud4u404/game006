name: CI

# 每次推送都跑检查，一共大约八分钟（check 约五分钟、smoke 约三分钟，两个并行跑）。
# 协作者只需要推送分支，不用自己建 PR：
# 分支名形如 <工具名>/<Issue 编号>-<英文>，open-pr 会按 Issue 自动建 PR（Issue 已关闭或带「暂缓」就不建，在 Issue 下留言）；
# 协作者往已有 PR 的分支推送，open-pr 顺手摘掉 PR 上的「要改」。
# 检查结果出来以后的事（红了打「要改」、全绿且只动了内容就 squash 合并）在 automerge.yml，
# 它由 workflow_run 触发，用的是 main 上的那份，所以分支上的工作流文件落后也不影响。规则见 docs/auto-review.md。
# 分支上的检查测的是「合进最新 main 以后」的样子；自动合并后再把 main 重测一遍。
# 冒烟测试失败会自动重试一次，所以不要推空提交「重跑 CI」：先看日志里是哪一步红。
on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 合入最新 main，测的是合并以后的样子
        if: github.ref != 'refs/heads/main'
        run: |
          git config user.name ci && git config user.email ci@localhost
          git merge --no-edit origin/main || { echo "::error::和 main 有冲突，先合入最新的 main 并解决冲突再推送"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 类型检查与测试（含内容校验、文风与剧透检查）
        run: npm run check
      - name: 打包
        run: npm run build

  smoke:
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 20   # 兜底：卡在装浏览器、拉代码上时别占满默认的六小时
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 合入最新 main，测的是合并以后的样子
        if: github.ref != 'refs/heads/main'
        run: |
          git config user.name ci && git config user.email ci@localhost
          git merge --no-edit origin/main || { echo "::error::和 main 有冲突，先合入最新的 main 并解决冲突再推送"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 不再每次下载浏览器：GitHub 的机器上装着 Chrome，直接用它。
      # 下载浏览器要连带装几十兆系统字体，软件源慢的时候会卡住，或者抢不到安装锁而失败（#79、#90）。
      - name: 机器上没有 Chrome 时才下载浏览器
        timeout-minutes: 10
        run: command -v google-chrome || npx playwright install --with-deps chromium
      # 失败自动重试一次：无头浏览器偶尔抽风（超时、卡住），两次都红才算红，不用人手动重跑。
      # 第一次失败的日志还在上面，真有毛病看得出来。
      - name: 冒烟测试：从标题画面一路玩到首领战（失败自动重试一次）
        timeout-minutes: 15
        env:
          SMOKE_CHANNEL: chrome
        run: |
          npm run smoke || { echo "::warning::冒烟测试第一次没过（日志见上），自动重试一次，两次都没过才算红"; npm run smoke; }
      # 冒烟测试走认好的路，乱点测试随机点四百下，找没人走过的路：不报错、不卡死、不白屏。
      # 冒烟测试已经打过包，这里直接用 dist；失败时日志里有种子和最近二十次点击，本机 LUANDIAN_SEED=种子 npm run luandian 复现
      - name: 乱点测试：随机点四百下
        timeout-minutes: 5
        env:
          SMOKE_CHANNEL: chrome
        run: node scripts/luandian.mjs

  # 协作者推送任务分支后，自动建 PR（已有就沿用）。维护者的 claude/ 分支不在此列。
  # 判断顺序：分支名里有 Issue 编号 → 已有 PR 就摘掉「要改」并结束 →
  #   没有 PR 时先看 Issue：不存在报错；已关闭或带「暂缓」不建，在 Issue 下留言（同一原因只留一次）→ 建 PR，把 Issue 上的「给:xxx」标签复制过去。
  open-pr:
    if: >-
      github.event.deleted != true &&
      github.ref != 'refs/heads/main' &&
      !startsWith(github.ref_name, 'claude/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pr
        name: 找到或创建 PR
        run: |
          n=$(sed -nE 's#^[^/]+/([0-9]+)-.*#\1#p' <<< "$BRANCH")
          if [ -z "$n" ]; then
            echo "分支名里没有 Issue 编号（应为 <工具名>/<编号>-<英文>），不自动建 PR。"
            exit 0
          fi
          find_pr() { gh pr list --repo "$REPO" --base main --head "$BRANCH" --state open --json number --jq '.[0].number // empty'; }
          # 在 Issue 下留言，同一个原因只留一次（用隐藏标记认）
          issue_note() {
            mark="<!-- open-pr:$BRANCH:$1 -->"
            if ! gh issue view "$n" --repo "$REPO" --json comments --jq '.comments[].body' | grep -qF "$mark"; then
              gh issue comment "$n" --repo "$REPO" --body "$mark
          $2"
            fi
          }
          # 工作流里用到的标签，仓库里没有就先建（已有会报错，忽略）
          gh label create "要改" --repo "$REPO" --color d93f0b --description "维护者退回，原作者先改完再领新任务" 2> /dev/null || true
          pr=$(find_pr)
          if [ -n "$pr" ]; then
            echo "分支已有 PR #$pr：协作者又推送了，摘掉「要改」（CI 再红会自动加回来）。"
            gh pr edit "$pr" --repo "$REPO" --remove-label "要改" 2> /dev/null || true
            echo "pr=$pr" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 读 Issue：真 404（不存在）和临时错误（网络、限流）分开。临时错误重试一次，仍失败只警告，这次不建 PR
          info=""
          for try in 1 2; do
            if info=$(gh api "repos/$REPO/issues/$n" 2> issue-err.txt); then break; fi
            info=""
            if grep -q 'HTTP 404' issue-err.txt; then break; fi
            sleep 5
          done
          if [ -z "$info" ]; then
            if grep -q 'HTTP 404' issue-err.txt; then
              echo "::error::分支名里的 Issue #$n 不存在，不建 PR。分支名里的编号要写对。"
              exit 1
            fi
            echo "::warning::读 Issue #$n 连续失败（$(head -c 200 issue-err.txt)），这次不建 PR；重新运行这次 CI 即可。"
            exit 0
          fi
          if jq -e '.pull_request != null' <<< "$info" > /dev/null; then
            echo "::error::分支名里的 #$n 是个 PR，不是 Issue，不建 PR。分支名里的编号要写成 Issue 的编号。"
            exit 1
          fi
          if [ "$(jq -r .state <<< "$info")" != open ]; then
            issue_note closed "分支 \`$BRANCH\` 对应的 Issue #$n 已经关闭，CI 不建 PR。如果任务确实要继续做，请在这里说一声，等维护者重新打开 Issue；否则可以删掉这个分支。"
            echo "Issue #$n 已关闭，不建 PR。"
            exit 0
          fi
          if jq -e 'any(.labels[]; .name == "暂缓")' <<< "$info" > /dev/null; then
            issue_note hold "Issue #$n 带「暂缓」标签，现在不做，所以分支 \`$BRANCH\` 不建 PR。等维护者去掉「暂缓」后，再推送一次分支就会自动建 PR。"
            echo "Issue #$n 带「暂缓」，不建 PR。"
            exit 0
          fi
          title=$(jq -r .title <<< "$info" | sed -E 's/^【[^】]*】//')
          [ -n "$title" ] || title="$BRANCH"
          {
            echo "Closes #$n"
            echo
            echo "## 做了什么（取自提交说明）"
            echo
            git log --reverse --format='### %s%n%n%b' "origin/main..HEAD"
            echo "## 自检"
            echo
            echo "类型检查、全部测试、打包、冒烟测试由 CI 代跑，结果见本页的检查。"
            echo
            echo "> 这个 PR 由 CI 按分支 \`$BRANCH\` 自动创建。"
          } > body.md
          if url=$(gh pr create --repo "$REPO" --base main --head "$BRANCH" --title "[#$n] $title" --body-file body.md 2> err.txt); then
            pr=${url##*/}
          else
            cat err.txt
            pr=$(find_pr)   # 也可能是协作者自己刚建好
          fi
          if [ -z "$pr" ]; then
            if grep -qi 'no commits between' err.txt; then
              echo "分支和 main 没有差别，不建 PR。"
              exit 0
            fi
            if grep -qi 'not permitted to create' err.txt; then
              why="仓库还没允许 GitHub Actions 创建 PR。项目负责人请打开 Settings → Actions → General，在最下面的 Workflow permissions 里勾选「Allow GitHub Actions to create and approve pull requests」并保存，然后重新运行这次 CI。"
            else
              why="错误信息：$(head -c 300 err.txt)"
            fi
            issue_note create-failed "分支 \`$BRANCH\` 已推送，但 CI 没能自动创建 PR。$why 也可以点这里手动创建：https://github.com/$REPO/compare/main...$BRANCH?expand=1"
            exit 1
          fi
          # Issue 上的「给:xxx」（指派给哪位协作者）复制到 PR 上，这样 PR 被退回时，wait-for-work 能把它交还原作者
          while read -r label; do
            [ -n "$label" ] || continue
            gh pr edit "$pr" --repo "$REPO" --add-label "$label" || true
          done < <(jq -r '.labels[].name | select(startswith("给:"))' <<< "$info")
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "PR #$pr"
