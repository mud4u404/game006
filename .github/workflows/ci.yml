name: CI

# 每次推送都跑检查。协作者只需要推送分支，不用自己建 PR：
# 分支名形如 <工具名>/<Issue 编号>-<英文>，open-pr 会按 Issue 自动建 PR；
# 只新增内容包的（或「修订」任务点名的内容包），检查全部通过后由 automerge 自动合并。
# 分支上的检查测的是「合进最新 main 以后」的样子；自动合并后再把 main 重测一遍。规则见 docs/auto-review.md。
on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 合入最新 main，测的是合并以后的样子
        if: github.ref != 'refs/heads/main'
        run: |
          git config user.name ci && git config user.email ci@localhost
          git merge --no-edit origin/main || { echo "::error::和 main 有冲突，先合入最新的 main 并解决冲突再推送"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 类型检查与测试（含内容校验、文风与剧透检查）
        run: npm run check
      - name: 打包
        run: npm run build

  smoke:
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 20   # 兜底：卡在装浏览器、拉代码上时别占满默认的六小时
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 合入最新 main，测的是合并以后的样子
        if: github.ref != 'refs/heads/main'
        run: |
          git config user.name ci && git config user.email ci@localhost
          git merge --no-edit origin/main || { echo "::error::和 main 有冲突，先合入最新的 main 并解决冲突再推送"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 不再每次下载浏览器：GitHub 的机器上装着 Chrome，直接用它。
      # 下载浏览器要连带装几十兆系统字体，软件源慢的时候会卡住，或者抢不到安装锁而失败（#79、#90）。
      - name: 机器上没有 Chrome 时才下载浏览器
        timeout-minutes: 10
        run: command -v google-chrome || npx playwright install --with-deps chromium
      - name: 冒烟测试：从标题画面一路玩到首领战
        timeout-minutes: 10
        env:
          SMOKE_CHANNEL: chrome
        run: npm run smoke
      # 冒烟测试走认好的路，乱点测试随机点四百下，找没人走过的路：不报错、不卡死、不白屏。
      # 冒烟测试已经打过包，这里直接用 dist；失败时日志里有种子和最近二十次点击，本机 LUANDIAN_SEED=种子 npm run luandian 复现
      - name: 乱点测试：随机点四百下
        timeout-minutes: 5
        env:
          SMOKE_CHANNEL: chrome
        run: node scripts/luandian.mjs

  # 协作者推送任务分支后，自动建 PR（已有就沿用）。维护者的 claude/ 分支不在此列。
  open-pr:
    if: >-
      github.event.deleted != true &&
      github.ref != 'refs/heads/main' &&
      !startsWith(github.ref_name, 'claude/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
      issue: ${{ steps.pr.outputs.issue }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pr
        name: 找到或创建 PR
        run: |
          n=$(sed -nE 's#^[^/]+/([0-9]+)-.*#\1#p' <<< "$BRANCH")
          if [ -z "$n" ]; then
            echo "分支名里没有 Issue 编号（应为 <工具名>/<编号>-<英文>），不自动建 PR。"
            exit 0
          fi
          echo "issue=$n" >> "$GITHUB_OUTPUT"
          find_pr() { gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty'; }
          pr=$(find_pr)
          if [ -z "$pr" ]; then
            title=$(gh issue view "$n" --repo "$REPO" --json title --jq .title | sed -E 's/^【[^】]*】//')
            [ -n "$title" ] || title="$BRANCH"
            {
              echo "Closes #$n"
              echo
              echo "## 做了什么（取自提交说明）"
              echo
              git log --reverse --format='### %s%n%n%b' "origin/main..HEAD"
              echo "## 自检"
              echo
              echo "类型检查、全部测试、打包、冒烟测试由 CI 代跑，结果见本页的检查。"
              echo
              echo "> 这个 PR 由 CI 按分支 \`$BRANCH\` 自动创建。"
            } > body.md
            if url=$(gh pr create --repo "$REPO" --base main --head "$BRANCH" --title "[#$n] $title" --body-file body.md 2> err.txt); then
              pr=${url##*/}
            else
              cat err.txt
              pr=$(find_pr)   # 也可能是协作者自己刚建好
            fi
          fi
          if [ -z "$pr" ]; then
            if grep -qi 'no commits between' err.txt; then
              echo "分支和 main 没有差别，不建 PR。"
              exit 0
            fi
            if grep -qi 'not permitted to create' err.txt; then
              why="仓库还没允许 GitHub Actions 创建 PR。项目负责人请打开 Settings → Actions → General，在最下面的 Workflow permissions 里勾选「Allow GitHub Actions to create and approve pull requests」并保存，然后重新运行这次 CI。"
            else
              why="错误信息：$(head -c 300 err.txt)"
            fi
            mark="<!-- open-pr:$BRANCH -->"
            if ! gh issue view "$n" --repo "$REPO" --json comments --jq '.comments[].body' | grep -qF "$mark"; then
              gh issue comment "$n" --repo "$REPO" --body "$mark
          分支 \`$BRANCH\` 已推送，但 CI 没能自动创建 PR。$why 也可以点这里手动创建：https://github.com/$REPO/compare/main...$BRANCH?expand=1"
            fi
            exit 1
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "PR #$pr"

  # 只新增内容包的 PR，检查全部通过后自动合并，不需要人或 Claude 介入。
  # 改动了其他文件的 PR 不会自动合并，留给项目负责人。
  automerge:
    needs: [check, smoke, open-pr]
    if: needs.open-pr.outputs.pr != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ needs.open-pr.outputs.pr }}
      ISSUE: ${{ needs.open-pr.outputs.issue }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - name: 判断是不是只动了内容
        id: scope
        run: |
          held=$(gh pr view "$PR" --repo "$REPO" --json isDraft,labels --jq '.isDraft or any(.labels[]; .name == "暂缓合并")')
          if [ "$held" = "true" ]; then echo "草稿或带「暂缓合并」标签，不自动合并。"; echo "content_only=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Issue 正文「## 允许修改的文件」（也认「## 允许改的文件」）里点名的内容包和文档，可以修改。
          # 不限「修订」标签：内容任务也常要改已有的内容包（比如给已有武功补层级写法）
          allowed=$(gh issue view "$ISSUE" --repo "$REPO" --json body --jq .body | sed -n '/^## 允许修\{0,1\}改的文件/,/^## [^允]/p' | grep -oE '(src/content/packs|docs)/[A-Za-z0-9_.-]+[.](ts|md)' | sort -u)
          echo "允许修改：$allowed"
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[] | "\(.status) \(.deletions) \(.filename)"')
          ok=true
          [ -n "$files" ] || ok=false
          while read -r status deletions file; do
            [ -n "$file" ] || continue
            case "$status:$file" in
              added:src/content/packs/*.ts) ;;
              modified:src/content/packs/*.ts|added:docs/*.md|modified:docs/*.md) grep -qxF "$file" <<< "$allowed" || ok=false ;;
              modified:tests/forbidden-names.ts) [ "$deletions" = "0" ] || ok=false ;;
              *) ok=false ;;
            esac
            echo "$status $file"
          done <<< "$files"
          echo "content_only=$ok" >> "$GITHUB_OUTPUT"
          echo "只动了内容：$ok"
      - name: 合并
        if: steps.scope.outputs.content_only == 'true'
        # 只合并检查过的这一个提交；期间又有推送，就留给下一轮 CI
        run: gh pr merge "$PR" --repo "$REPO" --merge --match-head-commit "$GITHUB_SHA"
      - name: 关闭对应的 Issue，删除分支
        # 机器人合并时，GitHub 不会按「Closes #编号」自动关闭 Issue，这里补上。
        # 不关的话，协作者的 wait-for-work 会把它当成还没做的任务；分支留着，也会被当成有人在做。
        if: steps.scope.outputs.content_only == 'true'
        run: |
          gh issue close "$ISSUE" --repo "$REPO" --reason completed --comment "已由 #$PR 完成，检查通过后自动合并。" || true
          gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" || true
      - name: 部署试玩网址，并重测 main
        # 用 GITHUB_TOKEN 合并不会触发 main 上的推送事件，这里手动启动部署和 main 的检查
        if: steps.scope.outputs.content_only == 'true'
        run: |
          gh workflow run pages.yml --repo "$REPO" --ref main
          gh workflow run ci.yml --repo "$REPO" --ref main
