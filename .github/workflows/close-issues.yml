name: close-issues

# 有人手动合并 PR 后，关闭标题里 [#编号] 对应的 Issue。
# GitHub 按「Closes #编号」自动关闭有时不生效；Issue 不关，协作者的 wait-for-work 会把它当成还没做的任务。
# 自动合并的内容 PR 由 ci.yml 的 automerge 负责关闭，因为机器人合并不会触发本工作流。
on:
  pull_request:
    types: [closed]

jobs:
  close:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      TITLE: ${{ github.event.pull_request.title }}
    steps:
      - run: |
          for n in $(grep -oE '\[#[0-9]+\]' <<< "$TITLE" | tr -dc '0-9\n'); do
            [ "$(gh issue view "$n" --repo "$REPO" --json state --jq .state)" = OPEN ] || continue
            gh issue close "$n" --repo "$REPO" --reason completed --comment "已由 #$PR 完成。"
          done
