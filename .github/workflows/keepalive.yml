name: 云存档体检

# 对真实的云存档后台走一遍：登录、写存档、读回、记历史、匿名读不到别人的存档。
# 也顺带防休眠：Supabase 免费项目一周没人访问会暂停，这里每三天访问一次。
# 改了云存档相关的代码时，推送也会跑一次。
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:
  push:
    paths:
      - 'src/net/**'
      - 'scripts/cloud-check.mjs'
      - 'scripts/cloud-email.mjs'
      - '.github/workflows/keepalive.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 云存档体检
        run: node scripts/cloud-check.mjs
