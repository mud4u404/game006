const stages=[{name:'茶棚',title:'今夜<br><em>莫撑船</em>',time:'酉时',weather:'细雨 · 天将暗',loc:0,base:['雨下了一整天。你把湿船篙靠在韩嫂的门边。','邻桌的相士收起三支签，站起身来。'],quote:'相士道：「今夜莫撑船。」',after:'他掀开门帘，雨声一下涌了进来。'}, {name:'雨夜',title:'三倍的<br><em>船钱</em>',time:'戌时',weather:'急雨 · 天已黑',loc:1,base:['天黑透了。顾老爹咳得直不起腰，最后一趟夜渡只能你去。','草棚外，一个黑脸弓兵按着腰刀。他身后那人一副书生模样，两只手腕锁在铁铐里。'],quote:'弓兵拍下船钱，道：「去对岸，现在。」',after:'船在石桩边晃。书生登船时，铁链磕了船沿一下。'}, {name:'江心',title:'篙在<br><em>你手里</em>',time:'戌时一刻',weather:'夜雨 · 风更紧',loc:2,base:['雨点打在乌篷上，像有人在头顶撒豆子。船到江心，身后的书生忽然凑近了一步。'],quote:'他低声道：「我叫沈三。我没杀人……小兄弟，撑去芦苇滩。」',after:'弓兵的手按上刀柄。官渡那头，几点灯火正在晃。'}];

function voices(){const s=S(),p=selected==='mind';if(s.stage===0)return p?[{type:'悟性',name:'那一眼',text:'他说话时没看你的骨相，倒朝棚外望了一眼。那句话，是看了什么才说的？',action:'ask'},{type:'根骨',name:'湿衣里的寒气',text:'雨气贴着后背往里钻。船上可没这口热灶，临走喝碗汤，手脚不会这样冷。',action:'soup'},{type:'天资',name:'夜眼',text:'暮色底下，渡口多了一点灯火。那盏灯离石桩很远，挂得也低。',action:'lamp'}]:[{type:'膂力',name:'手里的分量',text:'饱水的船篙不轻。你一手提起，另一手还能挪开门口的柴筐。韩嫂正端着滚汤过来。',action:'wood'},{type:'根骨',name:'湿衣里的寒气',text:'雨气贴着后背往里钻。力气再足，撑一夜的船，也得先暖暖肚子。',action:'soup'},{type:'天资',name:'水性好',text:'檐下那股水，比进棚时急了。今夜江流如何，常去渡口挑水的韩嫂该知道。',action:'water'}];if(s.stage===1)return p?[{type:'悟性',name:'钱与眼神',text:'他拍下船钱时，眼睛一直盯着你。问一句夜里为何赶路，他的手便往刀柄挪。',action:'question'},{type:'身法',name:'跳板',text:'板头被雨泡滑了。脚踩在横纹上，船一晃，你还有一处借力。',action:'board'},{type:'定力',name:'先说清楚',text:'那人催得急，你也不必跟着急。只管撑船的话，最好在离岸前说清。',action:'terms'}]:[{type:'膂力',name:'压住跳板',text:'书生被铁链牵得身子一歪。你用篙压住板头，两个人就能先上船。可弓兵会看见这双手。',action:'brace'},{type:'身法',name:'跳板',text:'脚下那层青苔滑得很。把篙落到船尾再迈脚，别让一身力气使在空处。',action:'board'},{type:'定力',name:'先说清楚',text:'船钱放下了，腰刀还在他手边。把自己肯做的事说清，钱也得当面数。',action:'terms'}];return p?[{type:'悟性',name:'哪半句',text:s.flags.truth?'他说「没杀人」时直直望着你。说到替漕帮经手账目，眼睛却偏了过去。你还得问，不能就此信他。':'他说「没杀人」时直直望着你，别的话却迟迟没说。哪半句能信，还得追问。',action:'truth'},{type:'身法',name:'拔刀前',text:'弓兵的前脚踩着湿绳，肩头朝灯火偏了一下。趁他回头，篙可以先落在船尾。',action:'shift'},{type:'天资',name:'夜眼',text:'灯后的人戴着斗笠，站在渡口外侧；近处的弓兵戴的是官帽。岸上那几个人，来路还说不准。',action:'shadows'}]:[{type:'膂力',name:'横在两人之间',text:'篙比刀长。双手分开握，能先把两人隔住；他若贴身撞来，你还没学过拳脚。',action:'separate'},{type:'根骨',name:'撑住这一口气',text:'臂上渐渐发酸，冷雨还往领口里淌。前头喝没喝那碗热汤，这时候便觉出差别。',action:'breathe'},{type:'天资',name:'水性好',text:'回水绕着船尾走。若有人落水，顺着这道水势，能往芦苇边游；逆着来，力气很快耗尽。',action:'current'}];}
