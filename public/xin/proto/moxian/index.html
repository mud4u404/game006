idth:2px;background:var(--red);opacity:.55}.note-heading{display:flex;align-items:center;gap:7px}.note-heading h2{font-size:17px;letter-spacing:1px;font-weight:500;flex:1}.note-heading small{font:10px system-ui,sans-serif;color:var(--sub)}.note-heading button{font-size:11px;min-height:44px;min-width:44px;background:none;border:0}.note p{font-size:14px;line-height:1.7;min-height:46px}.note .receipt{color:var(--red)}.note .route{font:10px/1.5 system-ui,sans-serif;color:var(--sub);min-height:15px}.note-actions{display:flex;align-items:stretch;gap:8px;margin-top:auto}.note-actions button{display:flex;align-items:center;justify-content:center;flex-direction:column;flex:1;background:none;min-height:46px;padding:6px 4px;border:1px solid var(--line);border-radius:0;font-size:13px;line-height:1.25}.note-actions button:first-child{border-color:var(--red);color:var(--red)}.note-actions small{display:block;font:10px/1.3 system-ui,sans-serif;margin-top:3px;color:var(--sub)}.note-actions button:disabled{border-color:var(--line);color:var(--sub);opacity:.7}.foot{flex:none;padding-top:5px}.concern{width:100%;background:none;border:0;border-top:1px solid var(--line);display:flex;align-items:center;gap:7px;text-align:left;min-height:44px;padding:3px 0;font-size:12px}.concern small{font:9px system-ui,sans-serif;writing-mode:vertical-rl;flex:none;color:var(--red)}.concern span{flex:1;line-height:1.5}.concern b{font-weight:400;color:var(--red);font-size:19px}.tools{display:flex;align-items:center;gap:3px;min-height:36px;font:11px system-ui,sans-serif}.tools>button{font:11px system-ui,sans-serif;min-height:44px;min-width:44px;padding:3px 7px;border:0;background:none}.tools>button:last-child{padding:3px 10px}.legend{display:flex;align-items:center;gap:5px;margin-right:auto;color:var(--sub);font-size:10px}.legend i{width:13px;display:block;border-top:1px solid var(--ink)}.legend i.water{border-top:1px dashed var(--water);margin-left:3px}body.night{color-scheme:dark;--paper:#28242d;--ink:#d igcaption{font-size:13px;margin:8px 0}.review pre{overflow:auto;padding:12px;background:var(--note);font-size:12px}.review code{overflow-wrap:anywhere}.review ul,.review ol{padding-left:24px}@media(max-width:370px){.atlas{padding-left:9px;padding-right:9px}.place{width:70px}.place .name{font-size:13px}.place .person{font-size:10px}.status{font-size:11px}.note p{font-size:13px}.note-actions{gap:5px}.note-actions button{font-size:12px}.faction-label{letter-spacing:1px}.far{min-width:65px}}@media(max-height:760px){.atlas{padding-top:7px;padding-bottom:4px}.heading small{font-size:9px}h1{font-size:26px}.status{min-height:36px}.note{min-height:170px;padding-top:5px}.note p{font-size:13px;line-height:1.6;min-height:42px}.note-actions button{min-height:44px}.foot .tools{min-height:32px}.field{min-height:320px}}@media(max-height:650px){.atlas{height:auto;min-height:100svh;overflow:visible}.field{flex:none;height:350px}.heading h1{font-size:24px}.note{min-height:168px}.tools{min-height:34px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}@media(max-width:550px){.review .shots{grid-template-columns:1fr}}

<body>
  <main class="atlas" id="atlas">

    </header>
    <section class="map-paper" aria-label="横塘地图与原地纸笺">

          <path class="river-bank" d="M-9 174C57 177 77 248 67 293S18 352 43 405 54 449 83 473 M-4 226C19 266 6 307 4 329S-6 374 8 396"/>

          <g class="night-boats" id="night-boats"><g id="dark-boat" transform="translate(108 280) rotate(-16)"><path d="M-15 0Q0 14 18 0Z M-7-2q6-12 16 0m-23 4 30 0"/><circle cx="8" cy="-8" r="2"/></g><g transform="translate(24 229) rotate(17)"><path d="M-10 0Q0 9 14 0Z M-5-2q4-8 9 0"/></g></g>

        <div class="faction-label caobang-label" aria-hidden="true">漕帮地界</div><div class="faction-label guanfu-label" aria-hidden="true">官府地界</div>

<h3>旧版怎么做的（附截图或文件位置）</h3>
<p><code>src/ui/views/ditu.ts</code>：地图独立标签，点地名开说明，再点「去」；街边地点合入枢纽后列在图下。<code>src/ui/views/jianghu.ts</code>：主屏另有场景、人物、眼下要紧和「打开地图」；<code>src/styles/app.css:217</code> 起为地图卡片样式。</p>
<h3>好在哪</h3>
<p>地点、陆水路、去过/当前标记明确；赶路先讲耗时和费用；「眼下要紧」只留一件，目的地也可点。</p>
<h3>乱在哪、问题在哪</h3>
<p>人在主屏，去处在另一页；图下另有地点列表，文字、人、位置得跨区对照。已知人在另一处时，从主屏至少要打开地图、点地点、确认走、再点人物才可操作。地图不能持续陪阅读。</p>
<h3>新版怎么做</h3>
<p>一张舆图作主屏，十五个明面地点同时可见。人直接写在地点上，点人/地名选中；走过去后可原地交谈、打工或观察。小印沿真实连线走，步行实线、撑船虚线。原型雨夜/白天切换改作息，商店休市灰着写回来的时辰，暗船只在夜里出现。地图下缘预留纸笺空白，引线连到人，不覆盖地点；长见闻在独立可收起的记事弹层，正常阅读固定两三行。</p>
<h3>为什么更好（能比的就用数字比：点几下、读几行、几秒看懂）</h3>
<p>当前人点一次即展开两三个动作；远处人点一下、确认走、再做事，共三次，无地图标签或人物列表切换。十五地点常驻同屏；状态与一件惦记始终可见。昼夜变化直接发生在地点名、人物和船标记上。布局/点击和动作后果由实际 Chromium 验证，不能只凭截图断言更好。</p>
<h3>负责人比对的结论</h3>

        a.push(action('generalTalk','问绳与蓑衣','约5分',()=>{advance(5);record('柜前问价','铺主抽出一截麻绳给你看。蓑衣挂在后墙，摸上去还有晒过的草味。');}));break;
      case 'street':
        a.push(action('streetLook','听檐下动静','约5分',()=>{advance(5);record('檐下所闻',night()?'弓兵的灯移过墙头，铁匠铺的门闩响了一声。白日里的号子听不见了。':'两名脚夫从檐下经过，谈起今晚还要卸一船粮。你只听见这些，没有凑上去问。');}));
        a.push(action('teaGo','去韩嫂茶棚','约8分 · 精−1',()=>travel('tea')));break;
      case 'bridge':
        a.push(action('bridgeLook','俯身看桥洞','约5分',()=>{advance(5);record('桥栏所见','你伏在桥栏上向下看。水冲着青苔，桥洞内壁有几道浅痕，站在岸上辨不清。');}));
        a.push(action('rest','歇一刻','15分 · 精+2',()=>rest('桥头歇脚'),used('rest')?'今日已歇':s.energy===60?'精力已满':''));break;
      case 'temple':
        a.push(action('rest','檐下歇一刻','15分 · 精+2',()=>rest('土地庙歇脚'),used('rest')?'今日已歇':s.energy===60?'精力已满':''));
        a.push(action('templeLook','看破瓦漏雨','约5分',()=>{advance(5);record('破瓦底下',s.rain?'雨水落在供桌旁。你将靠在墙边的篙挪开，没去翻供桌后的东西。':'供桌旁留着一小摊水。你将靠在墙边的篙挪开，没去翻供桌后的东西。');}));break;
      case 'river':
        a.push(action('sound','探一段水势','10分 · 精−3',()=>{s.energy-=3;advance(10);s.flags.soundings=true;record('篙记住的水势','篙尖擦过泥底，你记下芦苇入口右边那截枯枝。再进苇丛，就知道在哪收篙。');},s.flags.soundings?'已经探过':s.energy<3?'精力不足3':''));
        a.push(action('reedGo','撑向芦苇滩','14分 · 精−3',()=>travel('reed'),s.energy<3?'精力不足3':''));
        a.push(action('ferryGo','撑回横塘渡','14分 · 精−3',()=>travel('ferry'),s.energy<3?'精力不足3':''));break;
      case 'reed':
        a.push(action('reedLook',night()?'点灯探苇丛':'再往深处探','10分 · 精−4',()=>{advance(10);s.energy-=4;s.flags.reedLook=true;record('苇丛深处',night()?'你点起油灯，苇叶后有水纹退开，仍没看清是什么。亮光照在乌篷上，隔水也看得见。':'你将篙探到更深处，船底下传来轻轻一响。泥水翻上来，没摸着东西，也没把未看见的地方画上图。');},s.flags.reedLook?'已经探过':night()&&!s.flags.lamp?'缺油灯，可等天亮':s.energy<4?'精力不足4':''));
        a.push(action('riverGo','收篙回江上','14分 · 精−3',()=>travel('river'),s.energy<3?'精力不足3':''));break;
    }
    return a;
  }
  function rest(title){advance(15);s.energy=Math.min(60,s.energy+2);mark('rest');record(title,'你歇了一刻，拧去袖口的水，站起来重新握住篙。今日再坐下，只歇脚，不再额外回精力。');}
  function setSeal(id){const p=byId[id];$('#seal').style.left=`${(p.x-42)/390*100}%`;$('#seal').style.top=`${p.y/470*100}%`;$('#seal').setAttribute('aria-label',`你在${p.name}`);}
  async function makeJourney(path){
    s.moving=true;document.body.classList.add('moving');render();
    const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
    try{for(const id of path.slice(1)){setSeal(id);if(!reduced)await new Promise(resolve=>setTimeout(resolve,270));s.visits.add(id);}}
    finally{s.loc=path.at(-1);s.selected=s.loc;s.moving=false;document.body.classList.remove('moving');}
  }
  async function travel(to){
    if(s.moving || to===s.loc)return;
    const r=shortest(s.loc,to);if(!r)return;
    if(s.energy<r.energy){record('脚下乏力',`去${byId[to].name}要精力${r.energy}，你只有${s.energy}。先在桥头或庙檐下歇歇，也可以去茶棚喝汤。`);render();return;}
    const from=byId[s.loc].name;const risky=to==='reed'&&night()&&!s.flags.soundings&&!s.flags.lamp;
    await makeJourney(r.path);s.energy-=r.energy;advance(r.minutes);
    if(risky){s.hp=Math.max(1,s.hp-4);record('船底碰了枯枝','夜里没探水、也没带灯，船底磕到枯枝。你扶篙时擦破手背，气血−4。退回江上再探水仍来得及。');}
    else record('到了'+byId[to].name,`${from} → ${byId[to].name}。${r.water?'你撑着自家的乌篷船靠近，收住篙。':'你沿石板路走到这里。'}${!open(byId[to])?'铺子已关，开门时辰写在图上。':describe(byId[to])}`);
    render();
  }
  function concern(){return s.flags.ferryHelp?'陆七听不听你说话，去小院问一句。':'顾老爹咳得厉害，去问今夜的船。';}
  function selectedNote(){
    const p=byId[s.selected],here=s.selected===s.loc,r=here?null:shortest(s.loc,p.id);
    const receipt=here&&s.receipt?.loc===p.id?s.receipt:null;
    const acts=here?actions(p):[action('travel',r?.water?'取篙，撑过去':'沿路走过去',`${r?.minutes||0}分 · 精−${r?.energy||0}`,()=>travel(p.id),r && s.energy<r.energy?`精力不足${r.energy}`:''),action('preview','看此处见闻','不花时辰',()=>showDialog(`<h2>${esc(p.name)}</h2><p>${esc(describe(p))}</p><p>远处只作查看，不会凭空与人交谈。走到这里，才有${esc(person(p))}眼前的动作。</p>`))];
    const heading=receipt?receipt.title:`${p.name}${here?' · 此处':''}`;
    const text=receipt?receipt.text:describe(p);
    $('#note').innerHTML=`<div class="note-heading"><h2 id="note-title">${esc(heading)}</h2><small>${here?esc(person(p)):'隔着'+(r?.water?'水路':'街路')}</small><button data-act="details" aria-label="展开${esc(p.name)}见闻">展开</button></div><p class="${receipt?'receipt':''}">${esc(text)}</p><p class="route">${esc(here?`第${s.day}日 · ${timeText()} · 说话和做事分别计时；费用先写在按钮上`:routeText(r))}</p><div class="note-actions">${acts.map(a=>`<button data-action="${a.id}" ${a.locked||s.moving?'disabled':''}>${esc(a.label)}<small>${esc(a.locked||a.meta)}</small></button>`).join('')}</div>`;
    const top=Math.max(15,Math.min(440,p.y));$('#leader').setAttribute('d',`M${p.x} ${top+24}Q${p.x+10} ${Math.min(460,top+55)} 200 470`);
  }
  function render(){
    document.body.classList.toggle('night',night());document.body.classList.toggle('dry',!s.rain);
    document.querySelector('meta[name="theme-color"]').content=night()?'#28242d':'#e6e7ed';
    $('#hour').textContent=`第${s.day}日 · ${timeText()}`;$('#sky').textContent=`${String(Math.floor(s.minutes/60)).padStart(2,'0')}:${String(s.minutes%60).padStart(2,'0')} · ${night()?'夜间':'白日'} · 切昼夜`;$('.time-switch').setAttribute('aria-label',`预览昼夜，现在第${s.day}日${timeText()}，${s.minutes}分`);
    $('#hp').textContent=s.hp;$('#health-fill').style.width=s.hp+'%';$('#money').textContent=s.money;$('#energy').textContent=s.energy;$('#weather').textContent=s.rain?'细雨 ↻':'雨歇 ↻';
    $('#places').innerHTML=sites.map(p=>`<button class="place ${p.id===s.loc?'here':''} ${p.id===s.selected?'selected':''} ${!open(p)||p.id==='luqi'&&luqiAway()?'closed':''} ${s.visits.has(p.id)?'went':''}" style="left:${p.x/390*100}%;top:${p.y/470*100}%" data-place="${p.id}" aria-label="${esc(p.name+' · '+person(p))}" ${p.id===s.loc?'aria-current="location"':''} ${s.moving?'disabled':''}><i class="pin"></i><span class="name">${esc(p.name)}</span><span class="person ${p.person||p.water?'':'empty'}">${esc(person(p))}</span></button>`).join('');
    const r=s.loc===s.selected?null:shortest(s.loc,s.selected);
    $('#journey-path').innerHTML=r?`<path class="journey" d="${r.path.map((id,i)=>`${i?'L':'M'}${byId[id].x} ${byId[id].y}`).join(' ')}"/>`:'';
    $('#dark-boat').setAttribute('transform',s.flags.sawBoat?'translate(28 409) rotate(-16)':'translate(108 280) rotate(-16)');
    $('#boat-caption').textContent=s.flags.sawBoat?'离岸':'夜船';$('#boat-caption').style.left=s.flags.sawBoat?'14%':'24%';$('#boat-caption').style.top=s.flags.sawBoat?'86%':'66%';
    if(!s.moving)setSeal(s.loc);selectedNote();$('#concern').textContent=concern();$('#count').textContent=s.journal.length||'';
    document.querySelectorAll('[data-act]').forEach(b=>b.disabled=s.moving);
  }
  let dialogOpener=null;
  function showDialog(html){dialogOpener=document.activeElement;$('#dialog-content').innerHTML=html;$('#dialog').showModal();$('.dialog-close').focus();}
  $('#dialog').addEventListener('close',()=>{if(dialogOpener?.isConnected)dialogOpener.focus();else $('[data-act="here"]').focus();});
  $('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){const r=$('#dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('#dialog').close();}});
  document.addEventListener('click',async e=>{
    const place=e.target.closest('[data-place]');if(place && !s.moving){s.selected=place.dataset.place;s.receipt=null;render();return;}
    const b=e.target.closest('button');if(!b||b.disabled||s.moving)return;
    if(b.dataset.action){const p=byId[s.selected];const a=s.selected===s.loc?actions(p).find(x=>x.id===b.dataset.action):b.dataset.action==='travel'?action('travel','','',()=>travel(p.id)):action('preview','','',()=>showDialog(`<h2>${esc(p.name)}</h2><p>${esc(describe(p))}</p><p>这里眼下是${esc(person(p))}。走到此处才可以做事，查看不花钱或时辰。</p>`));
      if(!a||a.locked)return;await a.run();render();if(!$('#dialog').open)$('.note-actions button:not(:disabled)')?.focus({preventScroll:true});return;
    }
    switch(b.dataset.act){
      case 'time':s.minutes=night()?15*60:21*60;s.receipt=null;render();$('#announcement').textContent=night()?'切到雨夜。铺子关门，暗船出现在江上。':'切到白天。铺子开门，夜船收起。';break;
      case 'weather':s.rain=!s.rain;render();break;
      case 'here':s.selected=s.loc;s.receipt=null;render();$('#note-title').scrollIntoView({block:'nearest'});break;
      case 'concern':s.selected=s.flags.ferryHelp?'luqi':'ferry';s.receipt=null;render();break;
      case 'details':{const p=byId[s.selected];showDialog(`<h2>${esc(p.name)} · 见闻</h2><p>${esc(describe(p))}</p>${s.receipt?.loc===p.id?`<h3>${esc(s.receipt.title)}</h3><p>${esc(s.receipt.text)}</p>`:''}<h3>去这里</h3><p>${s.loc===p.id?'你就在这里。':esc(routeText(shortest(s.loc,p.id)))}</p><h3>眼下的人</h3><p>${esc(person(p))}${!open(p)?'，店内动作要等开门。':'。'}</p><p>此处包含${p.id==='dock'?'货栈；未见过的暗仓不在图上':p.id==='official'?'校场与榜文墙':p.id==='post'?'驿站旁两三间小客店；往苏州要路引':'一处明面去处'}。长见闻收在此处，短纸笺不会盖住地点。</p>`);break;}
      case 'pause':showDialog(`<h2>${s.loc==='river'||s.loc==='reed'?'收篙歇脚':'原地歇脚'}</h2><p>歇一刻，精力回2；不花钱。时辰会往下走，人和铺子的作息也会变。</p><button data-act="takePause" ${s.energy>=60?'disabled':''}>歇一刻 · 15分${s.energy>=60?' · 精力已满':''}</button>`);break;
      case 'takePause':if(s.energy>=60)return;advance(15);s.energy=Math.min(60,s.energy+2);s.selected=s.loc;record('原地歇了一刻','你把篙放在手边，坐了一刻。时辰走了十五分，精力回2，起身还能接着走。');$('#dialog').close();render();break;
      case 'journal':showDialog(`<h2>你的记事</h2>${s.journal.length?s.journal.map(x=>`<div class="entry"><small>${esc(x.at+' · '+byId[x.loc].name)}</small><p><b>${esc(x.title)}</b><br>${esc(x.text)}</p></div>`).join(''):'<p>还没有做过什么。点图上的人，走到他面前，说一句话或做一件事。</p>'}`);break;
      case 'far':showDialog('<h2>往苏州</h2><p>路就在驿站外。先要有路引，首版还走不通；不把城里的镖局、当铺画进小镇。</p>');break;
      case 'help':showDialog('<h2>怎样看这张图</h2><p>你是一枚小印。图上的地名和人物都是可点的：选一处，纸笺连回它；隔着街路先走过去，到了再说话、做事。</p><p>实线走路，虚线撑船。芦苇滩和江上只通水路，经横塘渡取自家船篙。灰字写休市和回来时辰，仍可以走到门口。</p><p>点顶上的时辰可预览昼夜，钱、记事和做过的事保留；点雨字可看雨歇。这两个是原型预览工具，不算正式世界时间规则。</p><p>短叙事占地图预留的下缘空白，细线连回人物；长叙事点「展开」或「记事」读，收起回图。十五明面地点一直可见。</p><p>纯单页界面样例：没有正式战斗、自由NPC模拟、账号或存档。动作收益和作息为示例。重复工钱每日只结一次；等待开门会真的走时辰。</p><button data-act="reset">重看这一日</button><p><a href="?review=1">审阅：昼夜截图与对照卡</a></p>');break;
      case 'reset':location.href=location.pathname;break;
    }
  });
  $('#roads').innerHTML=edges.map(e=>`<path class="${e[3]?'water-route':'road'}" d="M${byId[e[0]].x} ${byId[e[0]].y}L${byId[e[1]].x} ${byId[e[1]].y}"/>`).join('');
  if(params.get('review')==='1'){document.body.classList.add('review-mode');document.body.append($('#review-template').content.cloneNode(true));return;}
  render();
})();
</script>
</body>
</html>
